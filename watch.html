<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Braaainshow!?</title>
  <meta name="description" content="Submit your audition for BRAAAINSHOW!?">
  <meta property="og:title" content="Braaainshow!?">
  <meta property="og:description" content="Submit your audition for BRAAAINSHOW!?">
  <meta name="theme-color" content="#f7f2df">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:ital,wght@0,400;0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <h1 class="intro-title"><a href="./" class="logo-link"><img class="logo" src="brainshowlogo.svg" alt="BRAAAINSHOW!? home" width="1513" height="482"></a></h1>

    <section id="loading">
      <div class="spinner" aria-hidden="true"></div>
      <p class="lead">Loading video…</p>
    </section>

    <section id="missing" hidden>
      <h2 class="intro-part">Video not found</h2>
      <p class="lead" id="missing-msg">This link may be broken or the video was removed.</p>
      <a class="btn btn-primary btn-block" href="./">Make your own madlib</a>
    </section>

    <section id="watch" hidden>
      <h2 class="intro-part">That’s a wrap!</h2>
      <video id="player" class="player" controls playsinline preload="metadata"></video>
      <p class="byline" id="w-byline" hidden></p>

      <details class="script" id="w-script">
        <summary id="w-script-title">Read the script</summary>
        <ol id="w-lines"></ol>
        <div id="w-fulltext" hidden></div>
      </details>

      <h2>Share with your comrades</h2>
      <div id="w-share" class="share"></div>
    </section>
  </main>

  <script type="module" src="js/watch.js"></script>
</body>
</html>
